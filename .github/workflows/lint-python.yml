name: Lint-Python

on:
  workflow_call:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Python files
        id: detect
        run: |
          if git ls-files | grep -E '\.py$' >/dev/null; then
            echo "has_py=true" >> $GITHUB_OUTPUT
          else
            echo "has_py=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip (no Python)
        if: steps.detect.outputs.has_py == 'false'
        run: echo "No Python files found; skipping."

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.has_py == 'true'
        with:
          python-version: "3.11"

      - name: Install ruff
        if: steps.detect.outputs.has_py == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff
        if: steps.detect.outputs.has_py == 'true'
        run: ruff check .

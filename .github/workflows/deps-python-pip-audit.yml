name: Deps-Python-PipAudit

on:
  workflow_call:

jobs:
  pip_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect server/requirements.txt
        id: detect
        run: |
          if [ -f "server/requirements.txt" ]; then
            echo "has_reqs=true" >> $GITHUB_OUTPUT
          else
            echo "has_reqs=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip (no server requirements)
        if: steps.detect.outputs.has_reqs == 'false'
        run: echo "No server/requirements.txt found; skipping."

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.has_reqs == 'true'
        with:
          python-version: "3.11"

      - name: Install pip-audit
        if: steps.detect.outputs.has_reqs == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit
        if: steps.detect.outputs.has_reqs == 'true'
        run: pip-audit -r server/requirements.txt

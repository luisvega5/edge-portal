name: Lint-Dockerfile

on:
  workflow_call:

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Dockerfile
        id: detect
        run: |
          if [ -f Dockerfile ] || git ls-files | grep -q "Dockerfile"; then
            echo "has_dockerfile=true" >> $GITHUB_OUTPUT
          else
            echo "has_dockerfile=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip (no Dockerfile)
        if: steps.detect.outputs.has_dockerfile == 'false'
        run: echo "No Dockerfile found. Skipping."

      - name: Hadolint
        if: steps.detect.outputs.has_dockerfile == 'true'
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .ci/.hadolint.yaml

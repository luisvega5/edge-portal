name: CI-Security

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  k8s_yaml:
    uses: ./.github/workflows/lint-k8s-yaml.yml

  docker_lint:
    uses: ./.github/workflows/lint-docker.yml

  secrets:
    uses: ./.github/workflows/secret-scan.yml

  trivy_fs:
    needs: [k8s_yaml, docker_lint, secrets]
    uses: ./.github/workflows/scan-trivy-fs.yml

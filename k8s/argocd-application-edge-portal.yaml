apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge-portal
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:luisvega5/edge-portal.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
